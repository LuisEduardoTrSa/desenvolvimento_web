<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repetição While</title>
</head>
<body>
    <script lang="javascript">
        // OBJETIVO: Escrever uma mensagem limitando em 10 vezes atravé de um contador que será incrementado de mais 1.
        // DEFINIÇÃO DE VARIÁVEL
        var js_contador=1;

        // APLICAÇÃO DO LAÇO DE REPETIÇÃO WHILE
        while(js_contador <=50){
            document.write('<p>'+js_contador+ ' Repetição de uma única linha de comando dentro de um laço de repetição: ');
                js_contador +=1;
        }
    </script>
</body>
</html>
