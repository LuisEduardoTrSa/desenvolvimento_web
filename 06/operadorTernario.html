<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operador Ternário</title>
</head>
<body>
    <script lang="javascript">
        // OBJETIVO: utilizar o operador ternário ? e :
        // Fazer um programa que vai receber uma variável com valor 30 e em seguida verificar condições se verdadeiro ou falso.

        // DEFINIÇÃO DE VARIÁVEIS
        var js_num = 30;
        
        // APLICAÇÃO DO OPERADOR TERNÁRIO
        document.write('<p> js_num <b> ==</b> 20 <b>?</b> "SIM" <b>:</b> "NÃO" - Resposta =>');
            ((js_num == 20) ? document.write('<b>SIM</b>') : document.write('<b>NÃO</b>'));
        document.write('<p> js_num <b> ==</b> 20 <b>?</b> "SIM" <b>:</b> "NÃO" - Resposta =>');
            ((js_num != 20) ? document.write('<b>SIM</b>') : document.write('<b>NÃO</b>'));
        
        // Se js_num for menor que 50 a resposta será:
        document.write('<p> js_num <b> < </b> 50 <b>?</b> "SIM" <b>:</b> "NÃO" - Resposta =>');
            ((js_num < 50) ? document.write('<b>SIM</b>') : document.write('<b>NÃO</b>'));
        
        // Se -20 for menor que 0 será verdadeiro ou falso
        document.write('<p> js_num <b> -20 </b> ==0 <b>?</b> "SIM" <b>:</b> "NÃO" - Resposta =>');
            ((js_num  -20) ? document.write('<b>SIM</b>') : document.write('<b>NÃO</b>'));
    </script>
</body>
</html>
