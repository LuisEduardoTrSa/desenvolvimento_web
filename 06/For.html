<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script lang="javascript">
        // OBJETIVO: aplicação do laço de repetição <for>, incremento +2 na variável js_num e apresentando os valores de 1 a 10

        // DEFINIÇÃO DE VARIÁVEIS
        var js_num;

        document.write('<p>Apresentação dos valores js_num=1 e menor ou igual a 10 incrementoando a variável +=2: ');
    
        for(js_num=1; js_num<=10; js_num+=2){
            document.write('<p>'+js_num);
        }
    </script>
</body>
</html>
